[workspace]
members = ["datasketches", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
homepage = "https://datasketches.apache.org"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/apache/datasketches-rust"
rust-version = "1.86.0"

[workspace.dependencies]
# Workspace dependencies
datasketches = { path = "datasketches" }

# Crates.io dependencies
clap = { version = "4.6.5", features = ["derive"] }
divan = { version = "0.1.21" }
googletest = { version = "0.14.3" }
insta = { version = "1.48.0" }
cargo_metadata = { version = "0.23.1" }
proptest = { version = "1" }
rand = { version = "0.9.2" }
which = { version = "8.0.5" }
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
tar = { version = "0.4.46", default-features = false }
ureq = { version = "3.3.0", default-features = false, features = [
  "rustls",
  "socks-proxy",
] }

[workspace.lints.rust]
unknown_lints = "deny"
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"

too_many_arguments = "allow"
needless_range_loop = "allow"
